name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$RENDER_DEPLOY_HOOK_URL"
